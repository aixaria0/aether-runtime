apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-engine
spec:
  selector:
    app: {{ .Release.Name }}-engine
  ports:
    - port: {{ .Values.executionEngine.port }}
      targetPort: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-control
spec:
  selector:
    app: {{ .Release.Name }}-control
  ports:
    - port: {{ .Values.controlPlane.port }}
      targetPort: http
