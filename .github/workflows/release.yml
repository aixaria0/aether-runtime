name: Release images
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: control-plane
            dockerfile: apps/control-plane/Dockerfile
          - service: execution-engine
            dockerfile: apps/execution-engine/Dockerfile
          - service: agent-service
            dockerfile: apps/agent-service/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service == 'agent-service' && 'apps/agent-service' || '.' }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.service }}:${{ github.ref_name }}
