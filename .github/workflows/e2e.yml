name: End-to-end
on:
  push:
  pull_request:
jobs:
  container-core-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build and start core
        run: docker compose up --build -d execution-engine control-plane
      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/health >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Test browser console and end-to-end execution
        run: |
          curl --fail --silent http://localhost:8080/ | grep -q 'Aether Console'
          python3 tests/e2e.py
      - name: Prove signing identity survives control-plane restart
        run: |
          before=$(curl --fail --silent http://localhost:8080/identity | python3 -c 'import json,sys; print(json.load(sys.stdin)["fingerprint_sha256"])')
          docker compose restart control-plane
          for i in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/health >/dev/null; then break; fi
            sleep 1
          done
          after=$(curl --fail --silent http://localhost:8080/identity | python3 -c 'import json,sys; print(json.load(sys.stdin)["fingerprint_sha256"])')
          test "$before" = "$after"
      - name: Container logs
        if: always()
        run: docker compose logs --no-color --tail=100
      - name: Shutdown
        if: always()
        run: docker compose down --remove-orphans

  native-core-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libgrpc++-dev protobuf-compiler-grpc libprotobuf-dev libssl-dev pkg-config
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Native two-process core smoke
        run: bash tests/native-e2e.sh
  adaptive-failover-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build and start fresh core
        run: docker compose up --build -d execution-engine control-plane
      - name: Wait for runtime readiness
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/health >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Remove native executor and prove verified failover
        run: |
          docker compose stop execution-engine
          python3 tests/failover_e2e.py
      - name: Restart control plane and prove durable failure memory
        run: |
          docker compose restart control-plane
          for i in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:8080/health >/dev/null
          python3 tests/failover_e2e.py --post-restart
      - name: Container logs
        if: always()
        run: docker compose logs --no-color --tail=160
      - name: Shutdown
        if: always()
        run: docker compose down -v --remove-orphans
